services:
  web:
    image: ghcr.io/3r6nuss/8bg:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATA_DIR: /app/data
      SESSION_SECRET: ${SESSION_SECRET:?Bitte einen zufaelligen Session-Schluessel mit mindestens 32 Zeichen setzen}
      SETUP_KEY: ${SETUP_KEY:?Bitte einen zufaelligen Einrichtungsschluessel mit mindestens 32 Zeichen setzen}
      HEALTH_TOKEN: ${HEALTH_TOKEN:?Bitte einen zufaelligen Health-Token mit mindestens 32 Zeichen setzen}
    volumes:
      - ivy_data:/app/data
    networks:
      proxy:
        aliases:
          - 8bg-web

volumes:
  ivy_data:
    name: 8bg_ivy_data

networks:
  proxy:
    external: true
    name: nginx-proxy-manager_default
